<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Transport Route & Crowd Estimator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Public Transport Route Finder</h1>
            <p>Find optimal routes and check real-time crowd levels</p>
        </header>

        <!-- Search & Control Card -->
        <main class="main-content">
            <section class="card search-card">
                <h2>Select Travel Route</h2>
                <form id="route-form" onsubmit="calculateRoute(event)">
                    <div class="form-group">
                        <label for="start-point">Starting Point</label>
                        <select id="start-point" required>
                            <option value="" disabled selected>Select origin stop...</option>
                            <option value="0">Central Terminal</option>
                            <option value="1">Tech Park Station</option>
                            <option value="2">University Junction</option>
                            <option value="3">Suburban Hub</option>
                            <option value="4">Airport Express</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="end-point">Destination</label>
                        <select id="end-point" required>
                            <option value="" disabled selected>Select destination stop...</option>
                            <option value="0">Central Terminal</option>
                            <option value="1">Tech Park Station</option>
                            <option value="2">University Junction</option>
                            <option value="3">Suburban Hub</option>
                            <option value="4">Airport Express</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" class="primary-btn">
                        <span id="btn-text">Proceed</span>
                        <span id="btn-loader" class="loader hidden"></span>
                    </button>
                </form>
            </section>

            <!-- Interactive Map & Route Display Card -->
            <section id="results-card" class="card results-card hidden">
                <h2>Recommended Route & Crowd Estimation</h2>
                
                <!-- Visual Map Display -->
                <div class="map-visualization">
                    <svg id="network-map" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet">
                        <!-- Dynamic lines and nodes generated via JavaScript -->
                    </svg>
                </div>

                <!-- Path Summary -->
                <div class="route-summary">
                    <div class="summary-item">
                        <span class="label">Total Travel Time:</span>
                        <span id="est-time" class="value">-- mins</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Route Congestion Level:</span>
                        <span id="est-crowd" class="value badge-status status-moderate">--%</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function calculateRoute(event) {
            event.preventDefault();

            const start = document.getElementById('start-point').value;
            const end = document.getElementById('end-point').value;

            if (start === end) {
                alert("Please select different starting and destination stops.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const resultsCard = document.getElementById('results-card');

            // Show Loading State
            btn.disabled = true;
            btnText.textContent = "Loading.....";
            btnLoader.classList.remove('hidden');
            resultsCard.classList.add('hidden');

            try {
                // Fetch shortest path calculation from C++ backend endpoint
                const response = await fetch(`/api/route?start=${start}&end=${end}`);
                if (!response.ok) throw new Error("Server error");
                
                const data = await response.json();

                // 1. Render Summary Details
                document.getElementById('est-time').textContent = `${data.totalTime} mins`;
                const crowdElem = document.getElementById('est-crowd');
                crowdElem.textContent = `${data.avgCrowd}% Density`;

                if (data.avgCrowd >= 75) {
                    crowdElem.className = 'value badge-status text-red';
                } else if (data.avgCrowd >= 50) {
                    crowdElem.className = 'value badge-status status-moderate';
                } else {
                    crowdElem.className = 'value badge-status text-green';
                }

                // 2. Render SVG Map Dynamically
                const svgMap = document.getElementById('network-map');
                svgMap.innerHTML = ''; // Clear prior render

                // Draw path lines between calculated stops
                for (let i = 0; i < data.path.length - 1; i++) {
                    const u = data.path[i];
                    const v = data.path[i + 1];
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", u.x);
                    line.setAttribute("y1", u.y);
                    line.setAttribute("x2", v.x);
                    line.setAttribute("y2", v.y);
                    line.setAttribute("class", "path-line active-path");
                    svgMap.appendChild(line);
                }

                // Draw nodes & labels
                data.path.forEach(node => {
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    g.setAttribute("class", "node-group");
                    g.setAttribute("transform", `translate(${node.x}, ${node.y})`);

                    let crowdClass = 'low-crowd';
                    let textClass = 'text-green';
                    if (node.density >= 75) { crowdClass = 'high-crowd'; textClass = 'text-red'; }
                    else if (node.density >= 50) { crowdClass = 'med-crowd'; textClass = 'text-orange'; }

                    g.innerHTML = `
                        <circle r="18" class="node-circle ${crowdClass}"></circle>
                        <text y="32" class="node-label">${node.name}</text>
                        <text y="-25" class="crowd-badge ${textClass}">${node.density}% Full</text>
                    `;
                    svgMap.appendChild(g);
                });

                // Display results card smoothly
                resultsCard.classList.remove('hidden');
                resultsCard.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                console.error("Route calculation error:", err);
                alert("Failed to reach server. Please check backend execution.");
            } finally {
                // Reset Button
                btn.disabled = false;
                btnText.textContent = "Proceed";
                btnLoader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
